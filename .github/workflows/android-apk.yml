# Builds an installable Android APK on every push to main (and on demand from the Actions tab).
# The result (APK + build log) is published to the `apk-build` branch, and also attached
# to the run as an artifact.
# The app settings come from app/.env (publishable key only, safe to commit).
# Optional repository secret for push notifications: GOOGLE_SERVICES_JSON.
name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/android-apk.yml"
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        id: build
        continue-on-error: true
        working-directory: app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -o pipefail
          {
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > google-services.json; fi
            npm ci --no-audit --no-fund &&
            npx expo prebuild --platform android --no-install &&
            cd android &&
            ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a
          } 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: scorpion-chemical-apk
          path: app/android/app/build/outputs/apk/release/*.apk
      - name: Publish result to the apk-build branch
        if: always()
        run: |
          mkdir -p /tmp/out
          echo "${{ steps.build.outcome }}" > /tmp/out/status.txt
          echo "run ${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA}" >> /tmp/out/status.txt
          tail -n 400 build.log > /tmp/out/build-tail.log 2>/dev/null || true
          cp app/android/app/build/outputs/apk/release/app-release.apk /tmp/out/scorpion-chemical.apk 2>/dev/null || true
          cd /tmp/out
          git init -q
          git checkout -q -b apk-build
          git add .
          git -c user.name="apk-builder" -c user.email="apk-builder@users.noreply.github.com" commit -qm "APK build ${GITHUB_RUN_NUMBER}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk-build
